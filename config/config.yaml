agent:
    name: QNG Agent
    polling:
        interval: 2
        max_attempts: 15
        timeout: 30
    version: 1.0.0
    workflow:
        max_retries: 3
        retry_delay: 5
        timeout: 300
cache:
    driver: memory
    redis:
        database: 0
        host: localhost
        password: ""
        port: 6379
        timeout: 5
database:
    driver: sqlite
    mysql:
        database: qng_agent
        host: localhost
        password: password
        port: 3306
        user: qng_agent
    postgres:
        database: qng_agent
        host: localhost
        password: password
        port: 5432
        ssl_mode: disable
        user: qng_agent
    sqlite:
        path: data/qng_agent.db
development:
    cors: true
    debug: true
    hot_reload: true
frontend:
    api:
        base_url: http://localhost:8080/api
        timeout: 30
    build_dir: ./frontend/build
    enabled: true
    host: localhost
    port: 3000
    websocket:
        enabled: true
        url: ws://localhost:8080/ws
llm:
    anthropic:
        api_key: ""
        model: claude-3-5-sonnet-20241022
        timeout: 30
    gemini:
        api_key: AIzaSyAkegfnlZ90z5TOINMPViATD7gTq7BLmAw
        model: gemini-1.5-flash
        timeout: 30
    modelscope:
        api_key: "3d885e31-789d-4a46-bb38-b849ae6e37b6"
        model: Qwen/Qwen2.5-VL-72B-Instruct
        base_url: https://api-inference.modelscope.cn/v1
        timeout: 30
        max_tokens: 2000
    openai:
        api_key: ""
        base_url: https://api.openai.com/v1
        max_tokens: 2000
        model: gpt-4
        timeout: 30
    provider: modelscope
logging:
    file: logs/qng_agent.log
    format: json
    level: info
    output: stdout
mcp:
    # 新版标准化MCP服务器配置
    servers:
        qng:
            enabled: true
            protocol: sse
            url: http://localhost:9091/api/mcp
            timeout: 30
            capabilities:
                - execute_workflow
                - get_session_status
                - submit_signature
        metamask:
            enabled: true
            protocol: stdio
            command: ["node", "metamask-server.js"]
            timeout: 30
            capabilities:
                - connect_wallet
                - sign_transaction
                - get_balance
        file_system:
            enabled: true
            protocol: sse
            url: http://localhost:8084/api/mcp
            timeout: 30
            capabilities:
                - read_file
                - write_file
                - list_directory
monitoring:
    enabled: true
    health_check:
        enabled: true
        path: /health
        port: 8080
    metrics:
        enabled: true
        port: 9090
security:
    cors:
        enabled: true
        headers:
            - Content-Type
            - Authorization
        methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
        origins:
            - http://localhost:3000
            - http://localhost:8080
    jwt_expiry: 24h
    jwt_secret: ${JWT_SECRET}
server:
    host: 0.0.0.0
    mode: release
    port: 8080
