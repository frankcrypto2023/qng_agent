# QNG Agent 配置文件
# 配置文件路径: config/config.yaml

server:
    host: "0.0.0.0"
    port: 8080
    mode: "release"

logging:
    level: "info"
    format: "json"
    output: "stdout"
    file: "logs/qng_agent.log"

# LLM 配置
llm:
    # 本地 LlamaCpp 配置
    llamacpp:
        # 可执行文件配置
        executable_path: "llama-server"      # llama-server 可执行文件路径
        
        # 服务配置
        base_url: "http://localhost:8081"  # llama-server 服务端口
        server_port: 8081                 # 启动端口
        
        # 模型配置
        # model_path: "/root/.cache/modelscope/hub/models/unsloth/gpt-oss-20b-GGUF/gpt-oss-20b-Q4_0.gguf"  # 模型文件路径
        model_path: " /root/.cache/modelscope/hub/models/unsloth/Qwen3-4B-Instruct-2507-GGUF/Qwen3-4B-Instruct-2507-Q5_K_M.gguf"  # 模型文件路径
        
        # 性能参数
        context_size: 4096      # 上下文窗口大小
        threads: 4              # CPU线程数
        temperature: 0.8        # 温度参数 (0.0-1.0)
        top_p: 0.95             # Top-P采样
        top_k: 40               # Top-K采样
        max_tokens: 2000        # 最大生成令牌数
        timeout: 60             # 超时时间(秒)
        
        # GPU设置 (可选)
        gpu: true             # 是否使用GPU
        gpu_threads: 1         # GPU线程数
        gpu_layers: 0          # GPU层数 (0表示不使用GPU)
        
        # 内存设置
        memory_map: true       # 内存映射
        memory_f16: false      # 使用FP16精度
        memory_lock: false     # 锁定内存
        
        # 重复惩罚
        repeat_penalty: 1.1    # 重复惩罚系数
        
        # 新增参数配置 - 参考您提供的参数
        cache_prompt: true           # 缓存提示
        reasoning_format: "none"     # 推理格式
        samplers: "edkypmxt"         # 采样器
        dynatemp_range: 0            # 动态温度范围
        dynatemp_exponent: 1         # 动态温度指数
        min_p: 0.05                  # 最小概率
        typical_p: 1                 # 典型概率
        xtc_probability: 0           # XTC概率
        xtc_threshold: 0.1           # XTC阈值
        repeat_last_n: 64            # 重复最后N个token
        presence_penalty: 0          # 存在惩罚
        frequency_penalty: 0         # 频率惩罚
        dry_multiplier: 0            # DRY乘数
        dry_base: 1.75               # DRY基础值
        dry_allowed_length: 2        # DRY允许长度
        dry_penalty_last_n: -1       # DRY惩罚最后N个token
        timings_per_token: true      # 每个token的时间统计
        
        # 服务器启动参数
        batch_size: 2048             # 批处理大小
        user_batch_size: 2048        # 用户批处理大小
        flash_attention: true        # 启用Flash Attention
        reasoning_effort: "high"     # 推理努力程度
        log_level: 1                 # 日志级别

    # Register合约配置
    register:
        core_address: "0x8CEC927eb5800Fa231c9a3bA6935A123EC19e881"
        extended_address: "0x5788Bfb8D705a17C529E65DdD7E9619EE939eFD6"
        network: "customnet"

    # 其他LLM提供商配置
    anthropic:
        api_key: ""
        model: claude-3-5-sonnet-20241022
        timeout: 30
    gemini:
        api_key: AIzaSyAkegfnlZ90z5TOINMPViATD7gTq7BLmAw
        model: gemini-1.5-flash
        timeout: 30
    modelscope:
        api_key: "3d885e31-789d-4a46-bb38-b849ae6e37b6"
        model: "qwen/Qwen2.5-7B-Instruct"
        base_url: "https://api.modelscope.cn/v1"
        timeout: 30
        max_tokens: 2000

# MCP 服务器配置
mcp:
    servers:
        qng:
            enabled: true
            protocol: "sse"
            url: "http://localhost:9091/api/mcp"
            timeout: 30
        metamask:
            enabled: true
            protocol: "stdio"
            timeout: 30
        file_system:
            enabled: true
            protocol: "sse"
            url: "http://localhost:8084/api/mcp"
            timeout: 30

# 智能体配置
agent:
    name: "QNG Agent"
    version: "1.0.0"
    execution_engine: "sop"
    workflow:
        timeout: 300
        max_retries: 3
        retry_delay: 5
    polling:
        interval: 2
        timeout: 30
        max_attempts: 15

# 前端配置
frontend:
    enabled: true
    host: "localhost"
    port: 3000
    build_dir: "frontend/build"
    api:
        base_url: "http://localhost:8080/api"
        timeout: 30
    websocket:
        enabled: true
        url: ws://localhost:8080/ws

# 数据库配置
database:
    driver: "sqlite"
    sqlite:
        path: "data/qng_agent.db"

# 缓存配置
cache:
    enabled: true
    type: "memory"
    ttl: 3600

# 安全配置
security:
    enabled: true
    jwt_secret: "your-secret-key"
    cors_origins: ["http://localhost:3000"]

# 监控配置
monitoring:
    enabled: true
    metrics_port: 9090
    health_check: true

# 开发配置
development:
    debug: false
    hot_reload: true
    log_level: "debug"
