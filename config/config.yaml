agent:
    name: QNG Agent
    polling:
        interval: 2
        max_attempts: 15
        timeout: 30
    version: 1.0.0
    workflow:
        max_retries: 3
        retry_delay: 5
        timeout: 300
    # 执行引擎选择: sop 或 langgraph
    execution_engine: langgraph  # 可选值: sop, langgraph, auto
    # auto: 自动选择，优先使用SOP，失败时回退到LangGraph
    # sop: 强制使用SOP工作流引擎
    # langgraph: 强制使用LangGraph引擎
cache:
    driver: memory
    redis:
        database: 0
        host: localhost
        password: ""
        port: 6379
        timeout: 5
database:
    driver: sqlite
    mysql:
        database: qng_agent
        host: localhost
        password: password
        port: 3306
        user: qng_agent
    postgres:
        database: qng_agent
        host: localhost
        password: password
        port: 5432
        ssl_mode: disable
        user: qng_agent
    sqlite:
        path: data/qng_agent.db
development:
    cors: true
    debug: true
    hot_reload: true
frontend:
    api:
        base_url: http://localhost:8080/api
        timeout: 30
    build_dir: ./frontend/build
    enabled: true
    host: localhost
    port: 3000
    websocket:
        enabled: true
        url: ws://localhost:8080/ws
llm:
    # 本地 LlamaCpp 配置
    llamacpp:
        # 可执行文件配置
        executable_path: "llama-server"      # llama-server 可执行文件路径
        
        # 服务配置
        base_url: "http://localhost:8081"  # llama-server 服务端口
        server_port: 8081                 # 启动端口
        
        # 模型配置
        model_path: "/root/.cache/modelscope/hub/models/unsloth/gpt-oss-20b-GGUF/gpt-oss-20b-Q4_0.gguf"  # 模型文件路径
        
        # 性能参数
        context_size: 4096      # 上下文窗口大小
        threads: 4              # CPU线程数
        temperature: 0.7        # 温度参数 (0.0-1.0)
        top_p: 0.9             # Top-P采样
        top_k: 40              # Top-K采样
        max_tokens: 2000       # 最大生成令牌数
        timeout: 60            # 超时时间(秒)
        
        # GPU设置 (可选)
        gpu: true             # 是否使用GPU
        gpu_threads: 1         # GPU线程数
        gpu_layers: 0          # GPU层数 (0表示不使用GPU)
        
        # 内存设置
        memory_map: true       # 内存映射
        memory_f16: false      # 使用FP16精度
        memory_lock: false     # 锁定内存
        
            # 重复惩罚
    repeat_penalty: 1.1    # 重复惩罚系数

    # Register合约配置
    register:
        core_address: "0x8CEC927eb5800Fa231c9a3bA6935A123EC19e881"
        extended_address: "0x5788Bfb8D705a17C529E65DdD7E9619EE939eFD6"
        network: "customnet"

    # 其他LLM提供商配置
    anthropic:
        api_key: ""
        model: claude-3-5-sonnet-20241022
        timeout: 30
    gemini:
        api_key: AIzaSyAkegfnlZ90z5TOINMPViATD7gTq7BLmAw
        model: gemini-1.5-flash
        timeout: 30
    modelscope:
        api_key: "3d885e31-789d-4a46-bb38-b849ae6e37b6"
        model: Qwen/Qwen2.5-VL-72B-Instruct
        base_url: https://api-inference.modelscope.cn/v1
        timeout: 30
        max_tokens: 2000
    openai:
        api_key: ""
        base_url: https://api.openai.com/v1
        max_tokens: 2000
        model: gpt-4
        timeout: 30
    
    # 默认使用本地 LlamaCpp
    provider: modelscope
logging:
    file: logs/qng_agent.log
    format: json
    level: info
    output: stdout
mcp:
    # 新版标准化MCP服务器配置
    servers:
        qng:
            enabled: true
            protocol: sse
            url: http://localhost:9091/api/mcp
            timeout: 30
            capabilities:
                - execute_workflow
                - get_session_status
                - submit_signature
        metamask:
            enabled: true
            protocol: stdio
            command: ["node", "metamask-server.js"]
            timeout: 30
            capabilities:
                - connect_wallet
                - sign_transaction
                - get_balance
        file_system:
            enabled: true
            protocol: sse
            url: http://localhost:8084/api/mcp
            timeout: 30
            capabilities:
                - read_file
                - write_file
                - list_directory
monitoring:
    enabled: true
    health_check:
        enabled: true
        path: /health
        port: 8080
    metrics:
        enabled: true
        port: 9090
security:
    cors:
        enabled: true
        headers:
            - Content-Type
            - Authorization
        methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
        origins:
            - http://localhost:3000
            - http://localhost:8080
    jwt_expiry: 24h
    jwt_secret: ${JWT_SECRET}
server:
    host: 0.0.0.0
    mode: release
    port: 8080
